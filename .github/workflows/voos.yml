name: Alertas de voos

on:
  schedule:
    - cron: "23 */3 * * *"   # de 3 em 3 horas (UTC)
  workflow_dispatch:
    inputs:
      modo:
        description: "procurar = normal | simular = mostra sem avisar | teste = só envia uma notificação de teste"
        type: choice
        options: [procurar, simular, teste]
        default: procurar

permissions:
  contents: write

concurrency:
  group: alertas-voos
  cancel-in-progress: false

jobs:
  voos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Procurar voos
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          NTFY_SERVIDOR: ${{ secrets.NTFY_SERVIDOR }}
          MODO: ${{ inputs.modo || 'procurar' }}
        run: |
          case "$MODO" in
            simular) python voos.py --simular ;;
            teste)   python voos.py --teste ;;
            *)       python voos.py ;;
          esac

      - name: Guardar o que já foi avisado
        if: always()
        run: |
          git config user.name "alertas-voos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estado dos alertas"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push
          fi
